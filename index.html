<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

    body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 10deg, #0284c7 100%);
        background-attachment: fixed;
        color: #f8fafc;
        font-family: 'Segoe UI', system-ui, apple-system, sans-serif;
        min-height: 100vh;
        padding: 40px 0;
    }

    .page-title {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px)
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 16px 24px;
        font-size: 2.2rem;
        font-weight: 800;
        color: #38bdf8;
        text-align: center;
        letter-spacing: 0.5px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    #crypto-banner {
        display: block;
        margin: 0 auto;
        max-width: 140px;
        filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        transition: transform 0.3s ease;
        }

        #crypto-banner:hover {
        transform: scale(1.05);
     }

    .crypto-card {
         background: rgba(255, 255, 255, 0.05);
         backdrop-filter: blur(10px);
         border: 1px solid rgba(255, 255, 255, 0.1);
         border-radius: 16px;
         padding: 24px;
         height: 100%;
         transition: all 0.3s ease;
     }

        .crypto-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
     }
    
    .card-category {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #0f172a;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: inline-block;
            width: 100%;
    } 
     .crypto-card ul {
            padding-left: 20px;
            margin-bottom: 0;
    }

        .crypto-card li {
            color: #cbd5e1;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
    }
</style>
</head>
<body>
   <div class="container">
        <div class="row">
            <h1>Cryptocurrencies of the World</h1>
        </div>

        <br>
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg" id="crypto-banner" alt="Crypto Logo" class="img-fluid">
        <br>

        <div class="row">
            <div class="col">

            </div>

             <div class="col">
                
            </div>

             <div class="col">
                
            </div>
        </div>
        
   </div>
</body>
</html>
